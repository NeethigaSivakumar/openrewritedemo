server:
  port: 8080

spring:
  # SB2: spring.redis -> SB3: spring.data.redis
  redis:
    host: localhost
    port: 6379

  # SB2: spring.jpa.hibernate.use-new-id-generator-mappings is deprecated in SB3
  jpa:
    hibernate:
      use-new-id-generator-mappings: true
    show-sql: true

# SB2: logging.file -> SB3: logging.file.name
logging:
  file: app.log